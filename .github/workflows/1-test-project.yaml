name: Java CI with Docker Compose Postgres

on: push

jobs:
  build-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy .env-test to .env
        run: cp .env-test .env

      - name: Stop and remove all containers and volumes
        run: |
          docker compose down -v --remove-orphans
          docker system prune -a -f --volumes
      

      - name: Start services via Docker Compose
        run: docker compose --env-file .env-test up -d --build

      - name: Wait for Postgres to be ready
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
        run: |
          echo "Waiting for database..."
          POSTGRES_CONTAINER=$(docker ps -qf "name=postgres")
          until docker exec db pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Print environment variables from Postgres container
        run: docker exec db env

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Run tests
        env:
          DATABASE_NAME: SaveMoneySlot_TEST
          DATABASE_PASSWORD: root
          DATABASE_USER: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          JWT_SECRET_KEY: teste
          JWT_ISSUER: nteste
          FRONT_URL: http://localhost:4200
        run: ./gradlew test
