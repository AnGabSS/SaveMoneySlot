name: Java CI with Docker Compose Postgres
on: push

jobs:
  build-run:
    runs-on: ubuntu-latest

    # --- MUDANÇA: Centralize todas as variáveis de ambiente aqui ---
    env:
      DATABASE_NAME: SaveMoneySlot_TEST
      DATABASE_USER: postgres
      DATABASE_PASSWORD: root
      DATABASE_PORT: 5432
      JWT_SECRET_KEY: teste
      JWT_ISSUER: nteste
      FRONT_URL: http://localhost:4200

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- MUDANÇA: Etapas removidas que causavam inconsistência ---
      # Não precisamos mais copiar .env-test, pois as variáveis estão definidas acima

      - name: Stop and remove all containers and volumes
        run: |
          docker compose down -v --remove-orphans
          docker system prune -f --volumes

      # --- MUDANÇA: Inicia o Docker Compose usando as variáveis do job ---
      - name: Start services via Docker Compose
        run: docker compose up -d --build

      # --- MUDANÇA: O script de espera agora usa as variáveis do job ---
      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for database..."
          # Este loop agora usa as variáveis corretas ($DATABASE_USER, $DATABASE_NAME)
          until docker exec db pg_isready -U $DATABASE_USER -d $DATABASE_NAME; do
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Database is ready!"

      - name: Print environment variables from Postgres container
        run: docker exec db env

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Run tests
        run: ./gradlew test
