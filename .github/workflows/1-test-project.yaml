name: Java CI with Docker Compose Postgres

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # --- 1. Preparação do Ambiente ---

      - name: Checkout do repositório da aplicação principal
        uses: actions/checkout@v4

      - name: Checkout do repositório do Config Server
        uses: actions/checkout@v4
        with:
          repository: AnGabSS/SaveMoneySlot-config-server # <-- SUBSTITUA AQUI
          path: SaveMoneySlot-config-server
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # --- 2. FASE 1: Executar Testes de Unidade ---
      # Roda rápido e sem dependências externas. Se falhar, o job para aqui.
      - name: Run Unit Tests
        run: ./gradlew test

      # --- 3. Build dos Artefatos .jar ---
      # Só executa se os testes de unidade passarem.

      - name: Build do Config Server com Gradle
        run: |
          cd ../SaveMoneySlot-config-server
          ./gradlew bootJar
          cd -

      - name: Build da Aplicação Principal com Gradle
        run: ./gradlew bootJar

      # --- 4. FASE 2: Executar Testes de Integração ---

      - name: Iniciar contêineres com Docker Compose
        run: docker-compose up -d --build

      - name: Run Integration Tests
        # Executa a tarefa 'integrationTest' que criamos no Gradle.
        run: ./gradlew integrationTest

      # --- 5. Limpeza do Ambiente ---

      - name: Desligar contêineres
        if: always()
        run: docker-compose down -v --remove-orphans